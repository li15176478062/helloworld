<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World · 李梦宇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 48px 56px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    h1 { font-size: 2.4rem; margin-bottom: 16px; }
    p  { font-size: 1.15rem; opacity: 0.95; line-height: 1.8; }
    .time {
      margin-top: 20px;
      display: inline-block;
      padding: 8px 18px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World！</h1>
    <p>我是 李梦宇，我的第一个 AI 开发的网站</p>
    <p class="time">🕐 当前时间：<span id="clock"></span></p>
  </div>
  <script>
    function updateClock() {
      var now = new Date();
      var s = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clock').textContent = s;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
